version: "3.9"
name: SpbProk_RustDesk

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs
    volumes:
      - ./data:/root
    networks:
      - rustDeskNet
    ports:
      # used for the NAT type test
      - "21115:21115/tcp"
      # used for the ID registration and heartbeat service
      - "21116:21116/tcp"
      # used for TCP hole punching and connection service
      - "21116:21116/udp"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - rustDeskNet
    ports:
      # used for the Relay services
      - "21117:21117/tcp"
    restart: unless-stopped

networks:
  rustDeskNet:
    driver: bridge